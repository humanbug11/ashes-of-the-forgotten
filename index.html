<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>蒼の残火 - Browser Prototype</title>
<style>
:root{--bg:#08111e;--panel:rgba(7,14,25,.90);--line:#526982;--text:#eef5ff;--muted:#a8b7c9;--blue:#6ac8ff;--gold:#e4bd70;--green:#59ff9b;--red:#ff6673}
*{box-sizing:border-box} body{margin:0;background:#050a11;color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}.screen{display:none;min-height:100vh;position:relative}.screen.active{display:block}
#home{background:linear-gradient(rgba(3,8,15,.35),rgba(3,8,15,.82)),url('assets/stage.jpg') center/cover no-repeat;padding:28px 18px}
.shell{max-width:1180px;margin:auto}.brand{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(38px,7vw,84px);letter-spacing:.08em;text-shadow:0 0 22px rgba(99,185,255,.35)}.sub{color:var(--muted);font-size:14px;letter-spacing:.16em}.intro{max-width:620px;margin-top:18px;line-height:1.8}.panel{background:var(--panel);border:1px solid rgba(120,157,194,.45);box-shadow:inset 0 0 35px rgba(36,82,123,.16);border-radius:12px;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-title h2{margin:0;font-family:Georgia,"Yu Mincho",serif;font-weight:500}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px}.card{background:#0c1726;border:1px solid #273b53;border-radius:9px;padding:7px;cursor:pointer;min-height:144px;transition:.15s}.card.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(106,200,255,.22),0 0 18px rgba(106,200,255,.18)}.card img{width:100%;height:100px;object-fit:cover;border-radius:6px;background:#111}.card small{display:block;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weapon-card img{height:112px;object-fit:contain;background:#e9ebee}.startbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}.btn{border:1px solid #526982;background:#10243c;padding:13px 20px;border-radius:8px;cursor:pointer;min-height:46px}.btn.primary{background:linear-gradient(#175083,#0b2b50);border-color:#6ac8ff;box-shadow:0 0 18px rgba(106,200,255,.2);font-weight:700}.btn:hover{filter:brightness(1.12)}
#game{background:#02070d;padding:0;overflow:hidden}.game-wrap{position:relative;max-width:1280px;margin:auto;background:#050a10}.hud{position:absolute;inset:0 0 auto 0;z-index:5;display:grid;grid-template-columns:220px 1fr 170px;gap:14px;padding:12px;pointer-events:none}.hudbox{background:rgba(5,11,20,.72);border:1px solid rgba(160,190,220,.25);padding:9px 10px;border-radius:8px;backdrop-filter:blur(3px)}.bar{height:12px;background:#16202c;border:1px solid #496078;border-radius:999px;overflow:hidden}.fill{height:100%;width:50%;transition:width .15s}.hp{background:linear-gradient(90deg,#8b1c2e,#ff5f68)}.xp{background:linear-gradient(90deg,#2f8ec4,#92e8ff)}.hud-center{text-align:center}.timer{font-size:24px;font-family:Georgia,serif}.statrow{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}.stage{position:relative;aspect-ratio:16/9;width:100%;max-height:100vh}.stage canvas{width:100%;height:100%;display:block;background:#07101a}.cooldown{position:absolute;right:18px;bottom:20px;z-index:6;background:rgba(5,11,20,.75);padding:9px 12px;border:1px solid #405b76;border-radius:9px}.skillbtn{width:72px;height:72px;border:1px solid #74a9d8;background:#0d2138;border-radius:12px;display:grid;place-items:center;font-size:27px;cursor:pointer;position:relative}.skillbtn .cd{position:absolute;inset:auto 5px 4px 5px;font-size:11px;color:#d8edff}.mobile-pad{display:none;position:absolute;left:14px;bottom:14px;z-index:7;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}.mobile-pad button{border:1px solid #55708c;background:rgba(7,18,31,.78);border-radius:11px;color:white;font-size:22px}.mobile-pad .up{grid-column:2}.mobile-pad .left{grid-row:2;grid-column:1}.mobile-pad .down{grid-row:2;grid-column:2}.mobile-pad .right{grid-row:2;grid-column:3}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(3,7,13,.78);display:none;place-items:center;padding:18px;backdrop-filter:blur(4px)}.overlay.show{display:grid}.modal{width:min(900px,100%);background:#0a1422;border:1px solid #637e9d;border-radius:14px;padding:18px}.modal h2{text-align:center;font-family:Georgia,"Yu Mincho",serif;font-size:32px;margin:0 0 8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:#0f1d30;border:1px solid #385472;border-radius:11px;padding:15px;cursor:pointer;text-align:left}.choice:hover,.choice:focus{border-color:#76c9ff}.choice strong{display:block;font-size:18px;margin-bottom:7px}.choice p{font-size:13px;color:#c3d0de;line-height:1.55;margin:0}.result{text-align:center}.result h1{font-family:Georgia,serif;font-size:48px;margin:0 0 10px}.loot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.loot span{background:#131e2c;border:1px solid #394d63;padding:9px 12px;border-radius:7px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:10;background:rgba(10,18,30,.92);border:1px solid #d98f48;padding:12px 20px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}.hint{font-size:12px;color:var(--muted)}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.hud{grid-template-columns:130px 1fr 90px;padding:7px;gap:7px}.hudbox{padding:6px}.timer{font-size:18px}.mobile-pad{display:grid}.skillbtn{width:58px;height:58px}.cooldown{right:10px;bottom:12px}.choices{grid-template-columns:1fr}.card{min-height:126px}.card img{height:84px}.brand{font-size:44px}}
</style>
</head>
<body>
<section id="home" class="screen active">
  <div class="shell">
    <div class="brand">蒼の残火</div><div class="sub">ASHES OF THE FORGOTTEN — BROWSER PROTOTYPE</div>
    <p class="intro">見下ろし型ローグライトの簡易版です。敵を倒して緑のEXPオーブを集め、レベルアップで3択強化。条件が揃うとスキルが自動合成されます。</p>
    <div class="grid2">
      <div class="panel"><div class="section-title"><h2>衣装</h2><span id="outfitLabel" class="hint"></span></div><div id="outfitCards" class="cards"></div></div>
      <div class="panel"><div class="section-title"><h2>武器</h2><span id="weaponLabel" class="hint"></span></div><div id="weaponCards" class="cards"></div></div>
    </div>
    <div class="startbar panel"><div><strong>操作：</strong> WASD / 矢印キー、Q / Spaceで旋風斬り。スマホは画面ボタン。</div><button id="startBtn" class="btn primary">出撃する</button></div>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-wrap" id="gameWrap">
    <div class="stage">
      <canvas id="canvas" width="1280" height="720"></canvas>
      <div class="hud">
        <div class="hudbox"><div class="statrow"><span>HP</span><span id="hpText">100/100</span></div><div class="bar"><div id="hpFill" class="fill hp"></div></div><div style="height:6px"></div><div class="statrow"><span>Lv.<span id="lvText">1</span></span><span>ATK <span id="atkText">20</span></span></div></div>
        <div class="hudbox hud-center"><div class="statrow"><span>EXP</span><span id="xpText">0/30</span></div><div class="bar"><div id="xpFill" class="fill xp"></div></div><div class="timer" id="timer">01:30</div></div>
        <div class="hudbox"><div class="statrow"><span>撃破</span><span id="killText">0</span></div><div class="statrow"><span>素材</span><span id="matText">0</span></div><div class="hint" id="fusionText">未合成</div></div>
      </div>
      <div id="toast"></div>
      <div class="mobile-pad" aria-label="移動操作"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
      <div class="cooldown"><button id="skillBtn" class="skillbtn" aria-label="旋風斬り">⚔<span id="cdText" class="cd">READY</span></button></div>
      <div id="levelOverlay" class="overlay"><div class="modal"><h2>LEVEL UP</h2><p style="text-align:center;color:#aebdd0">新たな力を1つ選択</p><div id="choices" class="choices"></div></div></div>
      <div id="endOverlay" class="overlay"><div class="modal result"><h1 id="endTitle">STAGE CLEAR</h1><p id="endDesc"></p><div class="loot"><span>撃破 <b id="endKills">0</b></span><span>素材 <b id="endMats">0</b></span><span>Lv. <b id="endLv">1</b></span></div><button id="retryBtn" class="btn primary">もう一度</button> <button id="homeBtn" class="btn">ホームへ</button></div></div>
    </div>
  </div>
</section>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const home=$('#home'), game=$('#game'), canvas=$('#canvas'), ctx=canvas.getContext('2d');
const W=1280,H=720;
const outfitNames=['伝説の英雄','冬の狼','執事スタイル','学園スタイル','旅の剣士','狼フード','王国の礼装','白銀の騎士','祭の剣士','遺跡の探究者'];
const weaponNames=['鉄の剣','騎士の剣','エメラルドの剣','ダイヤの剣','金の剣','勇者の剣'];
const weaponAtk=[20,25,30,36,42,50];
let selectedOutfit=4, selectedWeapon=0;
const imgs={};
function loadImg(key,src){const i=new Image();i.src=src;imgs[key]=i}
loadImg('stage','assets/stage.jpg'); loadImg('skeleton','assets/skeleton.png'); loadImg('wolf','assets/wolf.png'); loadImg('knight','assets/knight.png'); loadImg('boss','assets/boss.png');
for(let i=1;i<=10;i++){loadImg('player'+i,`assets/player_${String(i).padStart(2,'0')}.png`)}
for(let i=1;i<=10;i++){const c=document.createElement('button');c.className='card';c.type='button';c.innerHTML=`<img src="assets/outfit_${String(i).padStart(2,'0')}.jpg" alt=""><small>${outfitNames[i-1]}</small>`;c.addEventListener('click',()=>{selectedOutfit=i-1;renderSelections()});$('#outfitCards').appendChild(c)}
for(let i=1;i<=6;i++){const c=document.createElement('button');c.className='card weapon-card';c.type='button';c.innerHTML=`<img src="assets/weapon_${String(i).padStart(2,'0')}.jpg" alt=""><small>${weaponNames[i-1]}</small>`;c.addEventListener('click',()=>{selectedWeapon=i-1;renderSelections()});$('#weaponCards').appendChild(c)}
function renderSelections(){[...$('#outfitCards').children].forEach((c,i)=>c.classList.toggle('selected',i===selectedOutfit));[...$('#weaponCards').children].forEach((c,i)=>c.classList.toggle('selected',i===selectedWeapon));$('#outfitLabel').textContent=outfitNames[selectedOutfit];$('#weaponLabel').textContent=weaponNames[selectedWeapon]}
renderSelections();

let running=false, paused=false, raf=0, last=0, gameTime=90, bossSpawned=false;
const keys=new Set(); const touchDirs=new Set();
let player,enemies,orbs,effects,projectiles,kills,mats;
function resetGame(){
 player={x:W/2,y:H/2,hp:100,maxHp:100,level:1,xp:0,nextXp:30,atk:weaponAtk[selectedWeapon],speed:235,attackCd:0,skillCd:0,magnet:125,whirlLv:1,whirlDmg:32,fire:false,fused:false,inv:0};
 enemies=[];orbs=[];effects=[];projectiles=[];kills=0;mats=0;gameTime=90;bossSpawned=false;paused=false;last=performance.now();updateHUD();
}
function start(){home.classList.remove('active');game.classList.add('active');resetGame();running=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
$('#startBtn').addEventListener('click',start); $('#retryBtn').addEventListener('click',()=>{$('#endOverlay').classList.remove('show');resetGame();running=true;raf=requestAnimationFrame(loop)}); $('#homeBtn').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);$('#endOverlay').classList.remove('show');game.classList.remove('active');home.classList.add('active')});
window.addEventListener('keydown',e=>{if(game.classList.contains('active')){keys.add(e.key.toLowerCase()); if([' ','q'].includes(e.key.toLowerCase())){e.preventDefault();useSkill()}}}); window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
$$('.mobile-pad button').forEach(b=>{const d=b.dataset.dir; const on=e=>{e.preventDefault();touchDirs.add(d)}; const off=e=>{e.preventDefault();touchDirs.delete(d)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}); $('#skillBtn').addEventListener('click',useSkill);
function spawnEnemy(type){let x,y;const edge=Math.floor(Math.random()*4);if(edge===0){x=Math.random()*W;y=-30}else if(edge===1){x=W+30;y=Math.random()*H}else if(edge===2){x=Math.random()*W;y=H+30}else{x=-30;y=Math.random()*H}let e;if(type==='boss')e={type,x,y,hp:650,maxHp:650,speed:50,dmg:22,r:42,img:'boss',scale:1.1};else if(type==='knight')e={type,x,y,hp:90,maxHp:90,speed:74,dmg:14,r:27,img:'knight',scale:.55};else if(type==='wolf')e={type,x,y,hp:48,maxHp:48,speed:120,dmg:10,r:22,img:'wolf',scale:.6};else e={type:'skeleton',x,y,hp:38,maxHp:38,speed:86,dmg:8,r:20,img:'skeleton',scale:.5};enemies.push(e)}
function damageEnemy(e,dmg){e.hp-=dmg;effects.push({kind:'hit',x:e.x,y:e.y,t:.25});if(e.hp<=0){kills++;const n=e.type==='boss'?10:e.type==='knight'?3:1;for(let i=0;i<n;i++)orbs.push({x:e.x+(Math.random()-.5)*28,y:e.y+(Math.random()-.5)*28,vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,val:e.type==='boss'?8:e.type==='knight'?4:2});if(e.type==='boss'||Math.random()<.13)mats++;e.dead=true}}
function attack(){let target=null,bd=190*190;for(const e of enemies){const dx=e.x-player.x,dy=e.y-player.y,d=dx*dx+dy*dy;if(d<bd){bd=d;target=e}}if(target){damageEnemy(target,player.atk);effects.push({kind:'slash',x:player.x,y:player.y,tx:target.x,ty:target.y,t:.22,color:'#b9e6ff'});if(player.fire){target.burn=2.5;target.burnTick=.5}}}
function useSkill(){if(!running||paused||player.skillCd>0)return;player.skillCd=player.fused?4.0:5.0;const range=player.fused?185:145, dmg=player.whirlDmg*(player.fused?1.55:1);effects.push({kind:'whirl',x:player.x,y:player.y,r:range,t:.55,color:player.fused?'#ff7b2f':'#76c9ff'});for(const e of enemies){const dx=e.x-player.x,dy=e.y-player.y;if(dx*dx+dy*dy<range*range){damageEnemy(e,dmg);if(player.fire){e.burn=3;e.burnTick=.1}}}}
function gainXp(v){player.xp+=v;while(player.xp>=player.nextXp){player.xp-=player.nextXp;player.level++;player.nextXp=Math.round(28+player.level*18);showLevelUp();break}updateHUD()}
const upgrades=[
 {name:'攻撃力強化',desc:'通常攻撃のダメージ +20%',apply:()=>player.atk=Math.round(player.atk*1.2)},
 {name:'旋風斬り強化',desc:'旋風斬りの威力 +30%、Lv上昇',apply:()=>{player.whirlDmg=Math.round(player.whirlDmg*1.3);player.whirlLv++}},
 {name:'EXP磁力',desc:'EXPオーブの吸引範囲 +70',apply:()=>player.magnet+=70},
 {name:'炎属性',desc:'通常攻撃と旋風斬りに炎を付与',apply:()=>player.fire=true},
 {name:'素早さ',desc:'移動速度 +12%',apply:()=>player.speed*=1.12},
 {name:'生命の加護',desc:'最大HP +25、HPを全回復',apply:()=>{player.maxHp+=25;player.hp=player.maxHp}},
 ];
function showLevelUp(){paused=true;const opts=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);const root=$('#choices');root.innerHTML='';opts.forEach(u=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`<strong>${u.name}</strong><p>${u.desc}</p>`;b.addEventListener('click',()=>{u.apply();if(player.fire&&player.whirlLv>=2&&!player.fused){player.fused=true;toast('SKILL FUSION! 炎 × 旋風斬り → 炎竜巻');$('#fusionText').textContent='炎竜巻'}$('#levelOverlay').classList.remove('show');paused=false;updateHUD()});root.appendChild(b)});$('#levelOverlay').classList.add('show')}
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity='1';setTimeout(()=>el.style.opacity='0',1800)}
function updateHUD(){$('#hpText').textContent=`${Math.max(0,Math.ceil(player.hp))}/${player.maxHp}`;$('#hpFill').style.width=`${Math.max(0,player.hp/player.maxHp*100)}%`;$('#lvText').textContent=player.level;$('#xpText').textContent=`${Math.floor(player.xp)}/${player.nextXp}`;$('#xpFill').style.width=`${player.xp/player.nextXp*100}%`;$('#atkText').textContent=Math.round(player.atk);$('#killText').textContent=kills;$('#matText').textContent=mats}
function end(clear){running=false;paused=true;$('#endTitle').textContent=clear?'STAGE CLEAR':'GAME OVER';$('#endTitle').style.color=clear?'#dff3ff':'#ff7a82';$('#endDesc').textContent=clear?'朽ちた草原を突破した。持ち帰った素材で次の強化へ。':'ここで倒れた。装備やビルドを変えて再挑戦しよう。';$('#endKills').textContent=kills;$('#endMats').textContent=mats;$('#endLv').textContent=player.level;$('#endOverlay').classList.add('show')}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();raf=requestAnimationFrame(loop)}
let spawnAcc=0;
function update(dt){gameTime-=dt;if(gameTime<=20&&!bossSpawned){bossSpawned=true;spawnEnemy('boss');toast('BOSS — 堕落騎士王');}if(gameTime<=0){const bossAlive=enemies.some(e=>e.type==='boss'&&!e.dead);if(!bossAlive)return end(true);gameTime=0}
 const mm=Math.floor(gameTime/60),ss=Math.floor(gameTime%60);$('#timer').textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
 let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup')||touchDirs.has('up'))dy--;if(keys.has('s')||keys.has('arrowdown')||touchDirs.has('down'))dy++;if(keys.has('a')||keys.has('arrowleft')||touchDirs.has('left'))dx--;if(keys.has('d')||keys.has('arrowright')||touchDirs.has('right'))dx++;if(dx||dy){const l=Math.hypot(dx,dy)||1;player.x=Math.max(32,Math.min(W-32,player.x+dx/l*player.speed*dt));player.y=Math.max(70,Math.min(H-32,player.y+dy/l*player.speed*dt))}
 player.attackCd-=dt;player.skillCd=Math.max(0,player.skillCd-dt);player.inv=Math.max(0,player.inv-dt);if(player.attackCd<=0){attack();player.attackCd=.62}
 $('#cdText').textContent=player.skillCd<=0?'READY':player.skillCd.toFixed(1)+'s';
 spawnAcc+=dt;const rate=Math.max(.18,.75-gameTime/220);if(spawnAcc>rate&&enemies.length<75){spawnAcc=0;const r=Math.random();spawnEnemy(gameTime<45&&r<.12?'knight':r<.35?'wolf':'skeleton')}
 for(const e of enemies){if(e.dead)continue;const ex=player.x-e.x,ey=player.y-e.y,l=Math.hypot(ex,ey)||1;e.x+=ex/l*e.speed*dt;e.y+=ey/l*e.speed*dt;if(e.burn){e.burn-=dt;e.burnTick-=dt;if(e.burnTick<=0){e.burnTick=.45;damageEnemy(e,5)}}if(l<e.r+23&&player.inv<=0){player.hp-=e.dmg;player.inv=.55;if(player.hp<=0)return end(false)}} enemies=enemies.filter(e=>!e.dead);
 for(const o of orbs){const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy);if(d<player.magnet){const s=350+(player.magnet-d)*3;o.vx+=dx/(d||1)*s*dt;o.vy+=dy/(d||1)*s*dt}o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.94;o.vy*=.94;if(d<26){o.dead=true;gainXp(o.val)}}orbs=orbs.filter(o=>!o.dead);
 effects.forEach(f=>f.t-=dt);effects=effects.filter(f=>f.t>0);updateHUD();}
function drawSprite(img,x,y,w,h){if(img&&img.complete&&img.naturalWidth){ctx.drawImage(img,x-w/2,y-h*.82,w,h)}else{ctx.fillStyle='#ddd';ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill()}}
function draw(){ctx.clearRect(0,0,W,H);if(imgs.stage.complete)ctx.drawImage(imgs.stage,0,0,W,H);ctx.fillStyle='rgba(2,8,15,.38)';ctx.fillRect(0,0,W,H);
 // floor vignette
 const g=ctx.createRadialGradient(W/2,H/2,80,W/2,H/2,650);g.addColorStop(0,'rgba(60,95,120,.05)');g.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const o of orbs){ctx.save();ctx.shadowColor='#64ff96';ctx.shadowBlur=18;ctx.fillStyle='#6cff9d';ctx.beginPath();ctx.arc(o.x,o.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8ffe5';ctx.beginPath();ctx.arc(o.x-2,o.y-2,2.4,0,Math.PI*2);ctx.fill();ctx.restore()}
